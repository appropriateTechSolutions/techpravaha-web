# workflow_dispatch lets journal-draft.yml start CI on its journal/<slug> branch: a PR opened with the
# built-in token does not trigger pull_request workflows, but a dispatch made with it does.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
